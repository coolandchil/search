<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search</title>
<style>
:root{--bg:#fff;--fg:#202124;--muted:#5f6368;--line:#dfe1e5;--link:#1a0dab;--url:#188038;--btn:#f8f9fa}
@media (prefers-color-scheme:dark){:root{--bg:#202124;--fg:#e8eaed;--muted:#9aa0a6;--line:#5f6368;--link:#8ab4f8;--url:#81c995;--btn:#303134}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:652px;margin:0 auto;padding:0 16px}
.home{min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.logo{font-size:clamp(40px,12vw,72px);font-weight:500;letter-spacing:-2px;margin:0 0 24px;cursor:pointer}
.b{color:#4285f4}.r{color:#ea4335}.y{color:#fbbc05}.g{color:#34a853}
.top{display:flex;align-items:center;gap:20px;padding:20px 16px 12px;max-width:900px;margin:0 auto}
.top .logo{font-size:28px;margin:0;letter-spacing:-1px}
form{flex:1;width:100%;max-width:584px}
.box{display:flex;align-items:center;height:46px;border:1px solid var(--line);border-radius:24px;padding:0 16px}
.box:hover,.box:focus-within{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
input{flex:1;border:0;outline:0;background:transparent;color:var(--fg);font-size:16px;height:100%}
#results,#reader{max-width:652px;margin:0 auto;padding:8px 16px 40px}
.item{margin:0 0 26px}
.item .u{font-size:14px;color:var(--url);word-break:break-all}
.item a{font-size:20px;color:var(--link);text-decoration:none;display:inline-block;margin:2px 0}
.item a:hover{text-decoration:underline}
.item p{margin:0;font-size:14px;line-height:1.58;color:var(--muted)}
.msg{color:var(--muted);padding:12px 0}
.hidden{display:none}
.back{background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px 14px;font-size:14px;cursor:pointer}
#reader h2{font-size:22px;font-weight:500;margin:16px 0 6px}
.orig{font-size:13px;color:var(--link)}
.body{margin-top:16px;font-size:15px;line-height:1.65;word-break:break-word}
.tabs{display:flex;gap:8px;margin:14px 0 8px}
.tab{background:transparent;border:1px solid #dfe1e5;border-radius:16px;padding:6px 14px;font-size:13px;cursor:pointer;color:inherit}
.tab.on{background:#e8f0fe;border-color:#4285f4;color:#1a0dab}
.note{font-size:12px;color:#5f6368;margin-bottom:8px}
.frame{width:100%;height:75vh;border:1px solid #dfe1e5;border-radius:8px;background:#fff}
.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.suggest .chip{background:transparent;border:1px solid #dfe1e5;border-radius:16px;padding:7px 14px;font-size:13px;cursor:pointer;color:inherit}
.suggest .chip:hover{background:#f1f3f4}
@media (prefers-color-scheme:dark){.suggest .chip:hover{background:#303134}}
.suglabel{width:100%;text-align:center;font-size:12px;color:#5f6368;margin-bottom:-2px}
.body p{margin:0 0 12px}.body h3,.body h4,.body h5,.body h6{margin:18px 0 8px;font-weight:500}.body img{max-width:100%;height:auto}.body a{color:#1a0dab}.body ul{padding-left:22px}
.code{margin:12px 0 0;padding:12px;border:1px solid #dfe1e5;border-radius:8px;background:#f8f9fa;color:#202124;font:12px/1.5 Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:75vh;overflow:auto}
@media (prefers-color-scheme:dark){.code{background:#303134;color:#e8eaed;border-color:#5f6368}}
#coder{padding-top:20px}
#coder h2{font-size:22px;font-weight:500;margin:16px 0 6px}
#coder textarea{width:100%;height:220px;font:13px/1.5 Menlo,Consolas,monospace;padding:10px;border:1px solid #dfe1e5;border-radius:8px;background:#f8f9fa;color:#202124;resize:vertical}
#coder .row{display:flex;gap:8px;margin:10px 0}
#coder .runbtn{background:#1a73e8;color:#fff;border:0;border-radius:4px;padding:8px 18px;font-size:14px;cursor:pointer}
#coder .clearbtn{background:transparent;border:1px solid #dfe1e5;border-radius:4px;padding:8px 14px;font-size:14px;cursor:pointer;color:inherit}
#coder .result{width:100%;height:60vh;border:1px solid #dfe1e5;border-radius:8px;background:#fff}
@media (prefers-color-scheme:dark){#coder textarea{background:#303134;color:#e8eaed;border-color:#5f6368}}
.fsbox{position:relative}
.fsx{display:none}
.fsbox.fs{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#fff;margin:0;padding:0}
.fsbox.fs .frame,.fsbox.fs .result{width:100%;height:100%;border:0;border-radius:0}
.fsbox.fs .fsx{display:block;position:absolute;top:10px;right:10px;z-index:2;background:rgba(32,33,36,.85);color:#fff;border:0;border-radius:16px;padding:7px 14px;font-size:13px;cursor:pointer}
.thumb{display:block;width:168px;max-width:100%;border-radius:8px;margin:6px 0;cursor:pointer;background:#e8eaed}
.shortsframe{display:block;height:min(72vh,600px);aspect-ratio:9/16;width:auto;max-width:100%;margin:12px auto 0;border:0;border-radius:12px;background:#000}
.shortsnav{display:flex;justify-content:center;gap:12px;margin:12px 0}
.tab[disabled]{opacity:.4;cursor:default}
.shortsfeed{height:min(72vh,600px);width:min(100%,420px);margin:12px auto 0;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:12px;background:#111;scrollbar-width:none}
.shortsfeed::-webkit-scrollbar{display:none}
.shortslot{height:100%;display:flex;justify-content:center;scroll-snap-align:start;scroll-snap-stop:always}
.shortbox{position:relative;height:100%;aspect-ratio:9/16;background:#000}
.shortbox img.shortthumb{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.shortbox iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.ytmenu{width:100%;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.ytmenu.hidden{display:none}
.suglabel2{font-size:12px;color:#5f6368}
</style>
</head>
<body>
<div id="home" class="home wrap">
  <div class="logo" aria-label="Search"><span class="b">S</span><span class="r">e</span><span class="y">a</span><span class="b">r</span><span class="g">c</span><span class="r">h</span></div>
  <form id="f1" role="search"><div class="box"><input id="q1" type="search" placeholder="Search the web..." aria-label="Search the web" autofocus autocomplete="off"></div></form>

</div>

  <div class="top">
    <div class="logo" id="logo2" aria-label="Search"><span class="b">S</span><span class="r">e</span><span class="y">a</span><span class="b">r</span><span class="g">c</span><span class="r">h</span></div>
    <form id="f2" role="search"><div class="box"><input id="q2" type="search" aria-label="Search the web" autocomplete="off"></div></form>
  </div>
  <div id="results"></div>
  <div id="reader" class="hidden"></div>
  <div id="coder" class="hidden"></div>
</div>
<script>
var SUPABASE_URL = "https://edmapfgxlivaogrsahtx.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkbWFwZmd4bGl2YW9ncnNhaHR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMzY4MjgsImV4cCI6MjEwODcxMjgyOH0.E1AyPAkbVgn5uYnOGlnQQQIW7oezidSulTkfTpqwbho";
var FN = SUPABASE_URL + "/functions/v1/super-responder";
var AUTH = { apikey: SUPABASE_ANON_KEY, Authorization: "Bearer " + SUPABASE_ANON_KEY };

var out = document.getElementById("results");

var lastHtml = null;

function show(msg){ out.innerHTML = ""; var d = document.createElement("div"); d.className = "msg"; d.textContent = msg; out.appendChild(d); }
function safeUrl(u){ return /^https?:\/\//i.test(u) ? u : "#"; }
function clean(s){ return (s || "").replace(/<[^>]+>/g, ""); }

async function call(qs){
  var res = await fetch(FN + "?" + qs, { headers: AUTH });
  var data = await res.json();
  if(!res.ok) throw new Error(data.error || "Request failed");

}

function closeReader(){ coderBox.classList.add("hidden"); reader.classList.add("hidden"); out.classList.remove("hidden"); if(!out.children.length && typeof showStart === "function") showStart(); window.scrollTo(0,0); }
// Suggested sites: edit this list to add or remove shortcuts.
var SUGGESTED = [
  { name: "Cloud Moon", url: "https://web.cloudmoonapp.com" },
  { name: "Artic", url: "https://storage.googleapis.com/math-homework/index.html", app: true },

];
function renderSuggest(box){
  box.innerHTML = "";
  var l = document.createElement("div"); l.className = "suglabel"; l.textContent = "Suggested sites"; box.appendChild(l);
  SUGGESTED.forEach(function(s){
    var b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = s.name;
    b.onclick = function(){ goSite(s); };

  });
  var cb = document.createElement("button"); cb.type = "button"; cb.className = "chip"; cb.textContent = "</> Run your own code"; cb.onclick = function(){ openCoder(); };
  box.appendChild(cb);
  var ym = document.createElement("div"); ym.className = "ytmenu hidden";
  var yl = document.createElement("span"); yl.className = "suglabel2"; yl.textContent = "Search YouTube for:"; ym.appendChild(yl);
  [["Videos", "youtube: "], ["Channels", "channel: "], ["Shorts", "shorts: "]].forEach(function(c){
    var ob = document.createElement("button"); ob.type = "button"; ob.className = "chip"; ob.textContent = c[0];
    ob.onclick = function(){ var inp = document.getElementById("q1") || document.getElementById("q"); inp.value = c[1]; inp.focus(); ym.classList.add("hidden"); };
    ym.appendChild(ob);
  });
  var yb = document.createElement("button"); yb.type = "button"; yb.className = "chip"; yb.textContent = "▶ YouTube";
  yb.onclick = function(){ ym.classList.toggle("hidden"); };
  box.appendChild(yb); box.appendChild(ym);
}


function mkExit(box){ var x = document.createElement("button"); x.type = "button"; x.className = "fsx"; x.textContent = "Exit full screen"; x.onclick = function(){ exitFull(box); }; return x; }
function enterFull(box){ box.classList.add("fs"); if(box.requestFullscreen){ try{ var p = box.requestFullscreen(); if(p && p.catch) p.catch(function(){}); }catch(e){} } }
function exitFull(box){ box.classList.remove("fs"); if(document.fullscreenElement === box && document.exitFullscreen) document.exitFullscreen(); }
document.addEventListener("fullscreenchange", function(){ if(!document.fullscreenElement){ var a = document.querySelectorAll(".fsbox.fs"); for(var i = 0; i < a.length; i++) a[i].classList.remove("fs"); } });
document.addEventListener("keydown", function(e){ if(e.key === "Escape"){ var a = document.querySelectorAll(".fsbox.fs"); for(var i = 0; i < a.length; i++) a[i].classList.remove("fs"); } });

var coderBox = document.getElementById("coder");
var coderBuilt = false;
var coderTa = null, coderGo = null;
function buildCoder(){
  if(coderBuilt) return; coderBuilt = true;
  var back = document.createElement("button"); back.type = "button"; back.className = "back"; back.textContent = "← Back"; back.onclick = closeCoder;
  var h = document.createElement("h2"); h.textContent = "Run your own code";
  var note = document.createElement("div"); note.className = "note"; note.textContent = "Paste HTML, CSS and JavaScript below and press Run. It runs in a sandbox and can’t touch the rest of this page.";
  var ta = document.createElement("textarea"); ta.spellcheck = false; ta.setAttribute("aria-label", "Your code");
  ta.value = ['<!DOCTYPE html>','<html>','<body style="font-family:sans-serif;text-align:center">','  <h1>Hello!</h1>','  <button onclick="this.textContent=\'Clicked!\'">Click me</button>','</body>','</html>'].join("\n");
  var row = document.createElement("div"); row.className = "row";
  var run = document.createElement("button"); run.type = "button"; run.className = "runbtn"; run.textContent = "Run";
  var clr = document.createElement("button"); clr.type = "button"; clr.className = "clearbtn"; clr.textContent = "Clear";
  var cfs = document.createElement("button"); cfs.type = "button"; cfs.className = "clearbtn"; cfs.textContent = "Full screen"; cfs.onclick = function(){ enterFull(cbox); };
  row.appendChild(run); row.appendChild(clr); row.appendChild(cfs);
  var res = document.createElement("iframe"); res.className = "result";
  res.setAttribute("sandbox", "allow-scripts allow-forms allow-popups");
  res.setAttribute("title", "Result");
  function go(){ res.srcdoc = ta.value; }
  run.onclick = go;
  clr.onclick = function(){ ta.value = ""; res.srcdoc = ""; ta.focus(); };
  ta.addEventListener("keydown", function(e){ if((e.ctrlKey || e.metaKey) && e.key === "Enter"){ e.preventDefault(); go(); } });
  coderBox.appendChild(back); coderBox.appendChild(h); coderBox.appendChild(note); coderBox.appendChild(ta); coderBox.appendChild(row); var cbox = document.createElement("div"); cbox.className = "fsbox"; cbox.appendChild(res); cbox.appendChild(mkExit(cbox));
  coderBox.appendChild(cbox);
  coderTa = ta; coderGo = go;
  go();
}
function closeCoder(){ coderBox.classList.add("hidden"); out.classList.remove("hidden"); if(!out.children.length && typeof showStart === "function") showStart(); window.scrollTo(0,0); }

function renderMd(box, text, base){
  box.innerHTML = "";
  function abs(h){ try{ return new URL(h, base).href; }catch(e){ return "#"; } }
  function inline(parent, s){
    var re = /!\[([^\]]*)\]\((\S+?)\)|\[([^\]]+)\]\((\S+?)\)|\*\*([^*]+)\*\*/g, last = 0, m;
    while((m = re.exec(s))){
      if(m.index > last) parent.appendChild(document.createTextNode(s.slice(last, m.index)));
      if(m[2] !== undefined){
        var u = abs(m[2]);
        if(/^https?:\/\//i.test(u)){ var im = document.createElement("img"); im.src = u; im.alt = m[1]; im.loading = "lazy"; im.referrerPolicy = "no-referrer"; parent.appendChild(im); }
      } else if(m[4] !== undefined){
        var t = abs(m[4]); var a = document.createElement("a");
        a.href = safeUrl(t); a.textContent = m[3];
        (function(link, label){ a.addEventListener("click", function(e){ e.preventDefault(); if(/^https?:\/\//i.test(link)) openReader({ title: label, url: link }); }); })(t, m[3]);
        parent.appendChild(a);
      } else {
        var b = document.createElement("strong"); b.textContent = m[5]; parent.appendChild(b);
      }
      last = re.lastIndex;
    }
    if(last < s.length) parent.appendChild(document.createTextNode(s.slice(last)));
  }
  var para = [], list = null;
  function flushPara(){ if(para.length){ var p = document.createElement("p"); inline(p, para.join(" ")); box.appendChild(p); para = []; } }
  function flushList(){ list = null; }
  String(text).split("\n").forEach(function(line){
    var h = /^(#{1,4})\s+(.*)$/.exec(line), li = /^\s*[-*]\s+(.*)$/.exec(line);
    if(h){ flushPara(); flushList(); var e = document.createElement("h" + (h[1].length + 2)); inline(e, h[2]); box.appendChild(e); }
    else if(li){ flushPara(); if(!list){ list = document.createElement("ul"); box.appendChild(list); } var l = document.createElement("li"); inline(l, li[1]); list.appendChild(l); }
    else if(!line.trim()){ flushPara(); flushList(); }
    else { flushList(); para.push(line.trim()); }
  });
  flushPara();
}

function embedUrl(u){
  try{
    var x = new URL(u), h = x.hostname.replace(/^www\./, "").replace(/^m\./, ""), id = null;
    if(h === "youtu.be") id = x.pathname.slice(1).split("/")[0];
    else if(h === "youtube.com" || h === "music.youtube.com"){
      if(x.pathname === "/watch") id = x.searchParams.get("v");
      else { var m = x.pathname.match(/^\/(shorts|embed|live)\/([\w-]{6,})/); if(m) id = m[2]; }
      var cm = !id && x.pathname.match(/^\/channel\/(UC[\w-]{22})/); if(cm) return "https://www.youtube.com/embed/videoseries?list=UU" + cm[1].slice(2);
      if(!id && x.pathname === "/playlist" && x.searchParams.get("list")) return "https://www.youtube.com/embed/videoseries?list=" + encodeURIComponent(x.searchParams.get("list"));
    }
    if(id && /^[\w-]{6,}$/.test(id)) return "https://www.youtube.com/embed/" + id;
    if(h === "vimeo.com"){ var v = x.pathname.match(/^\/(\d+)/); if(v) return "https://player.vimeo.com/video/" + v[1]; }
  }catch(e){}
  return u;
}

function isChannelUrl(u){ try{ var x = new URL(u); return /^(www\.|m\.)?youtube\.com$/.test(x.hostname) && /^\/(@[\w.-]+|c\/[\w.-]+|user\/[\w.-]+|channel\/UC[\w-]{22})(\/[a-z]+)?\/?$/.test(x.pathname); }catch(e){ return false; } }
function channelBase(u){ try{ var x = new URL(u); if(!/^(www\.|m\.)?youtube\.com$/.test(x.hostname)) return null; var m = /^\/(@[\w.-]+|c\/[\w.-]+|user\/[\w.-]+)(\/[a-z]+)?\/?$/.exec(x.pathname); return m ? "https://www.youtube.com/" + m[1] : null; }catch(e){ return null; } }
function isShortUrl(u){ try{ var x = new URL(u); return /^(www\.|m\.)?youtube\.com$/.test(x.hostname) && /^\/shorts\/[\w-]{6,}/.test(x.pathname); }catch(e){ return false; } }
function thumbFor(u){ var m = /\/embed\/([\w-]{6,})$/.exec(embedUrl(u)); return m ? "https://i.ytimg.com/vi/" + m[1] + "/mqdefault.jpg" : null; }

var shortsState = null;
function cleanTitle(t){ return String(t || "").replace(/\s*[-|]\s*YouTube.*$/i, "").replace(/#\S+/g, "").replace(/\s+/g, " ").trim(); }
function openShorts(list, start, topic){
  coderBox.classList.add("hidden"); out.classList.add("hidden"); reader.classList.remove("hidden"); reader.innerHTML = "";
  var items = list.map(function(r){ return { r: r, rec: false }; });
  var seen = {}; items.forEach(function(it){ seen[it.r.url] = true; });
  var cur = -1, loadingMore = false, noMore = false, slots = [], timer = null;
  var back = document.createElement("button"); back.type = "button"; back.className = "back"; back.textContent = "← Back to results"; back.onclick = function(){ shortsState = null; closeReader(); };
  var h = document.createElement("h2"); h.textContent = "Shorts";
  var count = document.createElement("div"); count.className = "note";
  var hint = document.createElement("div"); hint.className = "note"; hint.textContent = "Scroll or swipe up for the next Short. If the video grabs your mouse, scroll on the dark sides of it.";
  var link = document.createElement("a"); link.className = "orig"; link.target = "_blank"; link.rel = "noopener noreferrer"; link.textContent = "Open on YouTube";
  var feed = document.createElement("div"); feed.className = "shortsfeed";
  var nav = document.createElement("div"); nav.className = "shortsnav";
  var prev = document.createElement("button"); prev.type = "button"; prev.className = "tab"; prev.textContent = "↑ Previous";
  var next = document.createElement("button"); next.type = "button"; next.className = "tab"; next.textContent = "Next ↓";
  nav.appendChild(prev); nav.appendChild(next);
  function addSlot(it){
    var slot = document.createElement("div"); slot.className = "shortslot";
    var box = document.createElement("div"); box.className = "shortbox";
    var tu = thumbFor(it.r.url);
    if(tu){ var im = document.createElement("img"); im.className = "shortthumb"; im.alt = ""; im.referrerPolicy = "no-referrer"; im.src = tu; box.appendChild(im); }
    slot.appendChild(box); feed.appendChild(slot); slots.push(slot);
  }
  function info(){
    var it = items[cur];
    count.textContent = "Short " + (cur + 1) + " of " + items.length + (it.rec ? " · Recommended for you" : "") + (loadingMore ? " · finding more..." : "") + (noMore && cur === items.length - 1 ? " · no more found" : "");
    link.href = safeUrl(it.r.url);
    prev.disabled = cur <= 0; next.disabled = cur >= items.length - 1;
  }
  function unload(i){ var f = slots[i] && slots[i].querySelector("iframe"); if(f) f.parentNode.removeChild(f); }
  function loadSlot(i){
    var f = document.createElement("iframe");
    f.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-popups");
    f.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
    f.setAttribute("allow", "autoplay; encrypted-media; picture-in-picture; fullscreen");
    f.setAttribute("allowfullscreen", "");
    f.src = embedUrl(items[i].r.url) + "?autoplay=1&playsinline=1&rel=0";
    slots[i].querySelector(".shortbox").appendChild(f);
  }
  function fetchMore(){
    if(loadingMore || noMore) return;
    loadingMore = true; info();
    var qs = [cleanTitle(items[cur].r.title), topic].filter(function(x, k, a){ return x && a.indexOf(x) === k; });
    (async function(){
      var added = 0;
      for(var k = 0; k < qs.length && !added; k++){
        try{
          var d = await call("q=" + encodeURIComponent(qs[k] + " YouTube shorts") + "&site=youtube.com");
          d.results.forEach(function(r){ if(isShortUrl(r.url) && !seen[r.url]){ seen[r.url] = true; var it = { r: r, rec: true }; items.push(it); addSlot(it); added++; } });
        }catch(e){ break; }
      }
      loadingMore = false; if(!added) noMore = true;
      if(shortsState && shortsState.feed === feed) info();
    })();
  }
  function activate(i){
    if(i === cur || i < 0 || i >= slots.length) return;
    if(cur >= 0) unload(cur);
    cur = i; loadSlot(i); info();
    if(i >= items.length - 2) fetchMore();
  }
  function go(d){ var n = cur + d; if(n < 0 || n >= slots.length) return; feed.scrollTo({ top: n * feed.clientHeight, behavior: "smooth" }); }
  feed.addEventListener("scroll", function(){ clearTimeout(timer); timer = setTimeout(function(){ if(feed.clientHeight) activate(Math.round(feed.scrollTop / feed.clientHeight)); }, 120); });
  prev.onclick = function(){ go(-1); }; next.onclick = function(){ go(1); };
  reader.appendChild(back); reader.appendChild(h); reader.appendChild(count); reader.appendChild(hint); reader.appendChild(link); reader.appendChild(feed); reader.appendChild(nav);
  items.forEach(addSlot);
  shortsState = { go: go, feed: feed };
  var s0 = Math.min(start || 0, slots.length - 1);
  feed.scrollTop = s0 * feed.clientHeight;
  activate(s0);
  window.scrollTo(0,0);
}
document.addEventListener("keydown", function(e){
  if(!shortsState || !reader.contains(shortsState.feed) || reader.classList.contains("hidden")) return;
  var t = e.target && e.target.tagName; if(t === "INPUT" || t === "TEXTAREA") return;
  if(e.key === "ArrowDown" || e.key === "ArrowRight"){ e.preventDefault(); shortsState.go(1); }
  else if(e.key === "ArrowUp" || e.key === "ArrowLeft"){ e.preventDefault(); shortsState.go(-1); }
});

var appBlob = null;
async function openApp(s){
  coderBox.classList.add("hidden"); out.classList.add("hidden"); reader.classList.remove("hidden"); reader.innerHTML = "";
  if(appBlob){ URL.revokeObjectURL(appBlob); appBlob = null; }
  var back = document.createElement("button"); back.type = "button"; back.className = "back"; back.textContent = "← Back"; back.onclick = function(){ if(appBlob){ URL.revokeObjectURL(appBlob); appBlob = null; } closeReader(); };
  var h = document.createElement("h2"); h.textContent = s.name;
  var orig = document.createElement("a"); orig.className = "orig"; orig.href = safeUrl(s.url); orig.target = "_blank"; orig.rel = "noopener noreferrer"; orig.textContent = "Open original page";
  var tabs = document.createElement("div"); tabs.className = "tabs";
  var bFull = document.createElement("button"); bFull.type = "button"; bFull.className = "tab"; bFull.textContent = "Full screen"; tabs.appendChild(bFull);
  var note = document.createElement("div"); note.className = "note"; note.textContent = "Loading...";
  var frame = document.createElement("iframe"); frame.className = "frame";
  frame.setAttribute("sandbox", "allow-scripts allow-forms allow-popups allow-pointer-lock allow-modals allow-downloads");
  frame.setAttribute("allow", "fullscreen; autoplay");
  frame.setAttribute("allowfullscreen", "");
  var fbox = document.createElement("div"); fbox.className = "fsbox"; fbox.appendChild(frame); fbox.appendChild(mkExit(fbox));
  bFull.onclick = function(){ enterFull(fbox); };
  reader.appendChild(back); reader.appendChild(h); reader.appendChild(orig); reader.appendChild(tabs); reader.appendChild(note); reader.appendChild(fbox);
  window.scrollTo(0,0);
  try{
    var hashPart = "", base = s.url, i = s.url.indexOf("#");
    if(i >= 0){ hashPart = s.url.slice(i); base = s.url.slice(0, i); }
    var d = await call("src=" + encodeURIComponent(base) + "&full=1");
    var code = d.code;
    var isSvg = /^\s*(<\?xml[^>]*>\s*)?(<!--[\s\S]*?-->\s*)*<svg[\s>]/i.test(code);
    if(!isSvg && !/<base\s/i.test(code)){
      var tag = '<base href="' + base.replace(/"/g, "&quot;") + '">';
      code = /<head[^>]*>/i.test(code) ? code.replace(/<head[^>]*>/i, function(m){ return m + tag; }) : tag + code;
    }
    appBlob = URL.createObjectURL(new Blob([code], { type: isSvg ? "image/svg+xml" : "text/html" }));
    frame.src = appBlob + hashPart;
    note.textContent = "Running inside this page.";
  }catch(e){ note.textContent = "Could not load this one here (" + e.message + "). Use “Open original page” above."; }
}

async function openReader(r){
  coderBox.classList.add("hidden");
  out.classList.add("hidden");
  reader.classList.remove("hidden");
  reader.innerHTML = "";
  var back = document.createElement("button"); back.type = "button"; back.className = "back"; back.textContent = "← Back to results"; back.onclick = closeReader;
  var h = document.createElement("h2"); h.textContent = r.title;
  var orig = document.createElement("a"); orig.className = "orig"; orig.href = safeUrl(r.url); orig.target = "_blank"; orig.rel = "noopener noreferrer"; orig.textContent = "Open original page";
  var tabs = document.createElement("div"); tabs.className = "tabs";
  var names = { page: "Page view", text: "Text view", code: "Code view" };
  var btns = {};
  ["page","text","code"].forEach(function(k){ var b = document.createElement("button"); b.type = "button"; b.className = "tab"; b.textContent = names[k]; btns[k] = b; tabs.appendChild(b); });
  var srcText = null;
  var bRun = document.createElement("button"); bRun.type = "button"; bRun.className = "tab"; bRun.textContent = "Open in Run your code";
  bRun.onclick = async function(){
    bRun.textContent = "Loading source...";
    try{
      if(srcText === null){ var d = await call("src=" + encodeURIComponent(r.url)); srcText = d.code; }
      openCoder('<base href="' + r.url.replace(/"/g, "&quot;") + '">\n' + srcText);
    }catch(e){ alert("Could not load the source of this page (" + e.message + ")."); }
    bRun.textContent = "Open in Run your code";
  };
  tabs.appendChild(bRun);
  var bFull = document.createElement("button"); bFull.type = "button"; bFull.className = "tab"; bFull.textContent = "Full screen"; bFull.onclick = function(){ enterFull(fbox); }; tabs.appendChild(bFull);
  var note = document.createElement("div"); note.className = "note"; note.textContent = "If the page below is blank, that site doesn’t allow being shown here. Switch to Text view.";
  var frame = document.createElement("iframe"); frame.className = "frame";
  frame.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-popups");
  var emb = embedUrl(r.url);
  frame.setAttribute("referrerpolicy", emb !== r.url ? "strict-origin-when-cross-origin" : "no-referrer");
  frame.setAttribute("allow", "autoplay; encrypted-media; picture-in-picture; fullscreen");
  frame.setAttribute("allowfullscreen", "");
  var fbox = document.createElement("div"); fbox.className = "fsbox"; fbox.appendChild(frame); fbox.appendChild(mkExit(fbox));
  var chanBase = emb === r.url ? channelBase(r.url) : null;
  if(emb !== r.url) note.textContent = "Showing the video player for this link.";
  else if(chanBase) note.textContent = "Finding this channel\u2019s videos...";
  else if(/(^|\.)youtube\.com|youtu\.be/i.test(r.url)) note.textContent = "YouTube\u2019s own pages can\u2019t be shown here, but links to individual videos can. Paste a video link or search for one.";
  var body = document.createElement("div"); body.className = "body hidden";
  var code = document.createElement("pre"); code.className = "code hidden";
  reader.appendChild(back); reader.appendChild(h); reader.appendChild(orig); reader.appendChild(tabs); reader.appendChild(note); reader.appendChild(fbox); reader.appendChild(body); reader.appendChild(code);
  window.scrollTo(0,0);
  var loaded = { text: false, code: false };
  var resolvedChan = false;
  async function setMode(m){
    Object.keys(btns).forEach(function(k){ btns[k].className = "tab" + (k === m ? " on" : ""); });
    if(m === "page" && !frame.getAttribute("src")){
      if(chanBase && !resolvedChan){
        resolvedChan = true;
        try{
          var cd = await call("channel=" + encodeURIComponent(chanBase));
          emb = "https://www.youtube.com/embed/videoseries?list=UU" + cd.id.slice(2);
          frame.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
          note.textContent = "Showing this channel\u2019s uploads."; if(cd.title) h.textContent = cd.title;
        }catch(e){ note.textContent = "Could not find this channel\u2019s videos (" + e.message + "). Use \u201COpen original page\u201D above."; }
      }
      frame.src = safeUrl(emb);
    }
    fbox.classList.toggle("hidden", m !== "page"); bFull.classList.toggle("hidden", m !== "page"); note.classList.toggle("hidden", m !== "page");
    body.classList.toggle("hidden", m !== "text"); code.classList.toggle("hidden", m !== "code");
    if(m === "text" && !loaded.text){
      loaded.text = true; body.textContent = "Loading page...";
      try{ var data = await call("url=" + encodeURIComponent(r.url)); renderMd(body, data.content, r.url); }
      catch(e){ body.textContent = "Sorry, this page could not be shown as text (" + e.message + "). Use “Open original page” above."; }
    }
    if(m === "code" && !loaded.code){
      loaded.code = true; code.textContent = "Loading source...";
      try{ var d = await call("src=" + encodeURIComponent(r.url)); code.textContent = d.code; srcText = d.code; }
      catch(e){ code.textContent = "Sorry, the source of this page could not be loaded (" + e.message + ")."; }
    }
  }
  btns.page.onclick = function(){ setMode("page"); };
  btns.text.onclick = function(){ setMode("text"); };
  btns.code.onclick = function(){ setMode("code"); };
  setMode("page");
}

function asUrl(q){
  q = q.trim();
  if(/\s/.test(q)) return null;
  if(/^https?:\/\//i.test(q)) return q;
  if(/^(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}(\/\S*)?$/i.test(q)) return "https://" + q;
  return null;
}

var SEARCH_MODES = { youtube: "yt", yt: "yt", channel: "channel", channels: "channel", short: "shorts", shorts: "shorts" };
async function run(q){
  q = q.trim(); if(!q) return;
  var site = asUrl(q);
  if(site){ goSite({ title: site, url: site }); return; }
  var hm = /^(?:channels?\s*:\s*)?(@[\w.-]{2,})$/i.exec(q);
  if(hm){ goSite({ title: hm[1], url: "https://www.youtube.com/" + hm[1] }); return; }
  var mode = "", mm = /^(youtube|yt|channels?|shorts?)\s*:\s*(.+)$/i.exec(q);
  if(mm){ mode = SEARCH_MODES[mm[1].toLowerCase()]; q = mm[2].trim(); }
  var siteParam = mode ? "&site=youtube.com" : "";
  var apiQ = mode === "channel" ? q + " YouTube channel" : mode === "shorts" ? q + " YouTube shorts" : q;
  sugBox.classList.add("hidden");
  show("Searching...");
  closeReader();
  try{
    var data = await call("q=" + encodeURIComponent(apiQ) + siteParam);
    var list = data.results;
    if(mode === "yt") list = list.filter(function(r){ return embedUrl(r.url) !== r.url; });
    else if(mode === "channel") list = list.filter(function(r){ return isChannelUrl(r.url); });
    else if(mode === "shorts") list = list.filter(function(r){ return isShortUrl(r.url); });
    if(!list.length){
      if(mode === "yt") return show("No playable YouTube videos found for " + q);
      if(mode === "channel") return show("No channels found for " + q + ". If you know the channel’s name, type channel: @name.");
      if(mode === "shorts") return show("No Shorts found for " + q + ". Try a different topic.");
      return show("No results for " + q);
    }
    out.innerHTML = "";
    if(mode === "shorts"){
      var feed = document.createElement("button"); feed.type = "button"; feed.className = "back"; feed.textContent = "▶ Watch as a Shorts feed";
      feed.onclick = function(){ openShorts(list, 0, q); };
      out.appendChild(feed);
    }
    list.forEach(function(r, i){
      var item = document.createElement("div"); item.className = "item";
      var u = document.createElement("div"); u.className = "u"; u.textContent = r.url;
      var a = document.createElement("a"); a.href = safeUrl(r.url); a.textContent = r.title;
      function openIt(){ if(mode === "shorts") openShorts(list, i, q); else openReader(r); }
      a.addEventListener("click", function(e){ e.preventDefault(); openIt(); });
      var p = document.createElement("p"); p.textContent = clean(r.description);
      item.appendChild(u); item.appendChild(a);
      var tu = (mode === "yt" || mode === "shorts") ? thumbFor(r.url) : null;
      if(tu){ var th = document.createElement("img"); th.className = "thumb"; th.alt = ""; th.loading = "lazy"; th.referrerPolicy = "no-referrer"; th.src = tu; th.addEventListener("click", openIt); item.appendChild(th); }
      item.appendChild(p);
      out.appendChild(item);
    });
  }catch(e){ show("Something went wrong: " + e.message); }
}
var home = document.getElementById("home");
var page = document.getElementById("page");
function showStart(){ page.classList.add("hidden"); home.classList.remove("hidden"); }
function openCoder(code){ home.classList.add("hidden"); page.classList.remove("hidden"); out.classList.add("hidden"); reader.classList.add("hidden"); buildCoder(); coderBox.classList.remove("hidden"); if(typeof code === "string"){ coderTa.value = code; coderGo(); } window.scrollTo(0,0); }
function goSite(s){ home.classList.add("hidden"); page.classList.remove("hidden"); if(s.app) openApp(s); else openReader(s); }
var sugBox = document.getElementById("suggest");
renderSuggest(sugBox);
var _run = run;
run = function(q){ if(!q.trim()) return; home.classList.add("hidden"); page.classList.remove("hidden"); document.getElementById("q2").value = q.trim(); return _run(q); };
document.getElementById("f1").addEventListener("submit", function(e){ e.preventDefault(); run(document.getElementById("q1").value); });
document.getElementById("f2").addEventListener("submit", function(e){ e.preventDefault(); run(document.getElementById("q2").value); });
document.getElementById("logo2").addEventListener("click", function(){ closeReader(); page.classList.add("hidden"); home.classList.remove("hidden"); document.getElementById("q1").focus(); });
</script>
