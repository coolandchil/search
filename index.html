<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search</title>
<style>
:root{--bg:#fff;--fg:#202124;--muted:#5f6368;--line:#dfe1e5;--link:#1a0dab;--url:#188038;--btn:#f8f9fa}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:652px;margin:0 auto;padding:0 16px}
.home{min-height:70vh;display:flex;flex-direction:column;justify-content:center;align-items:center}
.logo{font-size:clamp(40px,12vw,72px);font-weight:500;letter-spacing:-2px;margin:0 0 24px;cursor:pointer}
.b{color:#4285f4}.r{color:#ea4335}.y{color:#fbbc05}.g{color:#34a853}
.top{display:flex;align-items:center;gap:20px;padding:20px 16px 12px;max-width:900px;margin:0 auto}
.top .logo{font-size:28px;margin:0;letter-spacing:-1px}
form{flex:1;width:100%;max-width:584px}
.box{display:flex;align-items:center;height:46px;border:1px solid var(--line);border-radius:24px;padding:0 16px}
.box:hover,.box:focus-within{box-shadow:0 1px 6px rgba(32,33,36,.28);border-color:transparent}
input{flex:1;border:0;outline:0;background:transparent;color:var(--fg);font-size:16px;height:100%}
#results,#reader{max-width:652px;margin:0 auto;padding:8px 16px 40px}
.item{margin:0 0 26px}
.item .u{font-size:14px;color:var(--url);word-break:break-all}
.item a{font-size:20px;color:var(--link);text-decoration:none;display:inline-block;margin:2px 0}
.item a:hover{text-decoration:underline}
.item p{margin:0;font-size:14px;line-height:1.58;color:var(--muted)}
.msg{color:var(--muted);padding:12px 0}
.hidden{display:none}
.back{background:var(--btn);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px 14px;font-size:14px;cursor:pointer}
#reader h2{font-size:22px;font-weight:500;margin:16px 0 6px}
.orig{font-size:13px;color:var(--link)}
.body{margin-top:16px;font-size:15px;line-height:1.65;word-break:break-word}
.tabs{display:flex;gap:8px;margin:14px 0 8px}
.tab{background:transparent;border:1px solid #dfe1e5;border-radius:16px;padding:6px 14px;font-size:13px;cursor:pointer;color:inherit}
.tab.on{background:#e8f0fe;border-color:#4285f4;color:#1a0dab}
.note{font-size:12px;color:#5f6368;margin-bottom:8px}
.frame{width:100%;height:75vh;border:1px solid #dfe1e5;border-radius:8px;background:#fff}
.suggest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:20px}
.suggest .chip{background:transparent;border:1px solid #dfe1e5;border-radius:16px;padding:7px 14px;font-size:13px;cursor:pointer;color:inherit}
.suggest .chip:hover{background:#f1f3f4}
@media (prefers-color-scheme:dark){.suggest .chip:hover{background:#303134}}
.suglabel{width:100%;text-align:center;font-size:12px;color:#5f6368;margin-bottom:-2px}
.body p{margin:0 0 12px}.body h3,.body h4,.body h5,.body h6{margin:18px 0 8px;font-weight:500}.body img{max-width:100%;height:auto}.body a{color:#1a0dab}.body ul{padding-left:22px}
.code{margin:12px 0 0;padding:12px;border:1px solid #dfe1e5;border-radius:8px;background:#f8f9fa;color:#202124;font:12px/1.5 Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:75vh;overflow:auto}

.fsbox{position:relative}
.fsx{display:none}
.fsbox.fs{position:fixed;top:0;left:0;right:0;bottom:0;z-index:9999;background:#fff;margin:0;padding:0}
.fsbox.fs .frame,.fsbox.fs .result{width:100%;height:100%;border:0;border-radius:0}
.fsbox.fs .fsx{display:block;position:absolute;top:10px;right:10px;z-index:2;background:rgba(32,33,36,.85);color:#fff;border:0;border-radius:16px;padding:7px 14px;font-size:13px;cursor:pointer}
.thumb{display:block;width:168px;max-width:100%;border-radius:8px;margin:6px 0;cursor:pointer;background:#e8eaed}
.shortsframe{display:block;height:min(72vh,600px);aspect-ratio:9/16;width:auto;max-width:100%;margin:12px auto 0;border:0;border-radius:12px;background:#000}
.shortsnav{display:flex;justify-content:center;gap:12px;margin:12px 0}
.tab[disabled]{opacity:.4;cursor:default}
.shortsfeed{height:min(72vh,600px);width:min(100%,420px);margin:12px auto 0;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:12px;background:#111;scrollbar-width:none}
.shortsfeed::-webkit-scrollbar{display:none}
.shortslot{height:100%;display:flex;justify-content:center;scroll-snap-align:start;scroll-snap-stop:always}
.shortbox{position:relative;height:100%;aspect-ratio:9/16;background:#000}
.shortbox img.shortthumb{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.shortbox iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
.ytmenu{width:100%;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}
.ytmenu.hidden{display:none}
.suglabel2{font-size:12px;color:#5f6368}
.fsall{position:fixed;top:8px;right:8px;z-index:100;background:rgba(255,255,255,.9);border:1px solid #dfe1e5;border-radius:16px;padding:6px 12px;font-size:12px;cursor:pointer;color:#202124}
.fsall:hover{background:#f1f3f4}
@media (prefers-color-scheme:dark){.fsall{background:rgba(48,49,52,.9);color:#e8eaed;border-color:#5f6368}}
.fsbox.fs:has(.shortsfeed){background:#000}
.fsbox.fs .shortsfeed{height:100%;width:min(100%,calc(100vh * 0.5625 + 80px));max-width:none;margin:0 auto;border-radius:0}
.proxyaddr{width:100%;padding:8px 12px;margin:8px 0;border:1px solid var(--line,#dfe1e5);border-radius:18px;background:transparent;color:inherit;font-size:14px}
.yth{max-width:1100px;margin:0 auto}
.ythbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
.ythbar input{flex:1;min-width:180px;padding:10px 16px;border:1px solid var(--line,#dfe1e5);border-radius:22px;background:transparent;color:inherit;font-size:16px}
.ythpills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.ythgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px 14px}
.ythcard{cursor:pointer}
.ythcard img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;background:#e8eaed}
.ythcard .tt{margin:8px 0 0;font-size:14px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ythcard:hover .tt{text-decoration:underline}
.ythsec{font-size:15px;font-weight:700;margin:20px 0 10px}
</style>
</head>

function renderMd(box, text, base){
  box.innerHTML = "";
  function abs(h){ try{ return new URL(h, base).href; }catch(e){ return "#"; } }
  function inline(parent, s){
    var re = /!\[([^\]]*)\]\((\S+?)\)|\[([^\]]+)\]\((\S+?)\)|\*\*([^*]+)\*\*/g, last = 0, m;
    while((m = re.exec(s))){
      if(m.index > last) parent.appendChild(document.createTextNode(s.slice(last, m.index)));
      if(m[2] !== undefined){
        var u = abs(m[2]);
        if(/^https?:\/\//i.test(u)){ var im = document.createElement("img"); im.src = u; im.alt = m[1]; im.loading = "lazy"; im.referrerPolicy = "no-referrer"; parent.appendChild(im); }
      } else if(m[4] !== undefined){
        var t = abs(m[4]); var a = document.createElement("a");
        a.href = safeUrl(t); a.textContent = m[3];
        (function(link, label){ a.addEventListener("click", function(e){ e.preventDefault(); if(/^https?:\/\//i.test(link)) openReader({ title: label, url: link }); }); })(t, m[3]);
        parent.appendChild(a);
      } else {
        var b = document.createElement("strong"); b.textContent = m[5]; parent.appendChild(b);
      }
      last = re.lastIndex;
    }
    if(last < s.length) parent.appendChild(document.createTextNode(s.slice(last)));
  }
  var para = [], list = null;
  function flushPara(){ if(para.length){ var p = document.createElement("p"); inline(p, para.join(" ")); box.appendChild(p); para = []; } }
  function flushList(){ list = null; }
  String(text).split("\n").forEach(function(line){
    var h = /^(#{1,4})\s+(.*)$/.exec(line), li = /^\s*[-*]\s+(.*)$/.exec(line);
    if(h){ flushPara(); flushList(); var e = document.createElement("h" + (h[1].length + 2)); inline(e, h[2]); box.appendChild(e); }
    else if(li){ flushPara(); if(!list){ list = document.createElement("ul"); box.appendChild(list); } var l = document.createElement("li"); inline(l, li[1]); list.appendChild(l); }
    else if(!line.trim()){ flushPara(); flushList(); }
    else { flushList(); para.push(line.trim()); }
  });
  flushPara();
}

function embedUrl(u){
  try{
    var x = new URL(u), h = x.hostname.replace(/^www\./, "").replace(/^m\./, ""), id = null;
    if(h === "youtu.be") id = x.pathname.slice(1).split("/")[0];
    else if(h === "youtube.com" || h === "music.youtube.com"){
      if(x.pathname === "/watch") id = x.searchParams.get("v");
      else { var m = x.pathname.match(/^\/(shorts|embed|live)\/([\w-]{6,})/); if(m) id = m[2]; }
      var cm = !id && x.pathname.match(/^\/channel\/(UC[\w-]{22})/); if(cm) return "https://www.youtube.com/embed/videoseries?list=UU" + cm[1].slice(2);
      if(!id && x.pathname === "/playlist" && x.searchParams.get("list")) return "https://www.youtube.com/embed/videoseries?list=" + encodeURIComponent(x.searchParams.get("list"));
    }
    if(id && /^[\w-]{6,}$/.test(id)) return "https://www.youtube.com/embed/" + id;
    if(h === "vimeo.com"){ var v = x.pathname.match(/^\/(\d+)/); if(v) return "https://player.vimeo.com/video/" + v[1]; }
  }catch(e){}
  return u;
}

          emb = "https://www.youtube.com/embed/videoseries?list=UU" + cd.id.slice(2);
          frame.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
          note.textContent = "Showing this channel\u2019s uploads."; if(cd.title) h.textContent = cd.title;
        }catch(e){ note.textContent = "Could not find this channel\u2019s videos (" + e.message + "). Use \u201COpen original page\u201D above."; }
      }
      frame.src = safeUrl(emb);
    }
    fbox.classList.toggle("hidden", m !== "page"); bFull.classList.toggle("hidden", m !== "page"); note.classList.toggle("hidden", m !== "page");
    proxyView.classList.toggle("hidden", m !== "proxy"); if(m === "proxy") proxyView.start();
    body.classList.toggle("hidden", m !== "text"); code.classList.toggle("hidden", m !== "code");
    if(m === "text" && !loaded.text){
      loaded.text = true; body.textContent = "Loading page...";
      try{ var data = await call("url=" + encodeURIComponent(r.url)); renderMd(body, data.content, r.url); }
      catch(e){ body.textContent = "Sorry, this page could not be shown as text (" + e.message + "). Use “Open original page” above."; }
    }
    if(m === "code" && !loaded.code){
      loaded.code = true; code.textContent = "Loading source...";
      try{ var d = await call("src=" + encodeURIComponent(r.url)); code.textContent = d.code; srcText = d.code; }
      catch(e){ code.textContent = "Sorry, the source of this page could not be loaded (" + e.message + ")."; }
    }
  }
  btns.page.onclick = function(){ setMode("page"); };
  btns.proxy.onclick = function(){ setMode("proxy"); };
  btns.text.onclick = function(){ setMode("text"); };
  btns.code.onclick = function(){ setMode("code"); };
  setMode("page");
}

function asUrl(q){
  q = q.trim();
  if(/\s/.test(q)) return null;
  if(/^https?:\/\//i.test(q)) return q;
  if(/^(www\.)?[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}(\/\S*)?$/i.test(q)) return "https://" + q;
  return null;
}

var SEARCH_MODES = { youtube: "yt", yt: "yt", channel: "channel", channels: "channel", short: "shorts", shorts: "shorts" };
async function run(q){
  q = q.trim(); if(!q) return;
  var site = asUrl(q);
  if(site){ goSite({ title: site, url: site }); return; }
  var hm = /^(?:channels?\s*:\s*)?(@[\w.-]{2,})$/i.exec(q);
  if(hm){ goSite({ title: hm[1], url: "https://www.youtube.com/" + hm[1] }); return; }
  var mode = "", mm = /^(youtube|yt|channels?|shorts?)\s*:\s*(.+)$/i.exec(q);
  if(mm){ mode = SEARCH_MODES[mm[1].toLowerCase()]; q = mm[2].trim(); }
  var siteParam = mode ? "&site=youtube.com" : "";
  var apiQ = mode === "channel" ? q + " YouTube channel" : mode === "shorts" ? q + " YouTube shorts" : q;
  sugBox.classList.add("hidden");
  show("Searching...");
  closeReader();
  try{
    var data = await call("q=" + encodeURIComponent(apiQ) + siteParam);
    var list = data.results;
    if(mode === "yt") list = list.filter(function(r){ return embedUrl(r.url) !== r.url; });
    else if(mode === "channel") list = list.filter(function(r){ return isChannelUrl(r.url); });
    else if(mode === "shorts") list = list.filter(function(r){ return isShortUrl(r.url); });
    if(!list.length){
      if(mode === "yt") return show("No playable YouTube videos found for " + q);
      if(mode === "channel") return show("No channels found for " + q + ". If you know the channel’s name, type channel: @name.");
      if(mode === "shorts") return show("No Shorts found for " + q + ". Try a different topic.");
      return show("No results for " + q);
    }
    out.innerHTML = "";
    if(mode === "shorts"){
      var feed = document.createElement("button"); feed.type = "button"; feed.className = "back"; feed.textContent = "▶ Watch as a Shorts feed";
      feed.onclick = function(){ openShorts(list, 0, q); };
      out.appendChild(feed);
    }
    list.forEach(function(r, i){
      var item = document.createElement("div"); item.className = "item";
      var u = document.createElement("div"); u.className = "u"; u.textContent = r.url;
      var a = document.createElement("a"); a.href = safeUrl(r.url); a.textContent = r.title;
      function openIt(){ if(mode === "shorts") openShorts(list, i, q); else openReader(r); }
      a.addEventListener("click", function(e){ e.preventDefault(); openIt(); });
      var p = document.createElement("p"); p.textContent = clean(r.description);
      item.appendChild(u); item.appendChild(a);
      var tu = (mode === "yt" || mode === "shorts") ? thumbFor(r.url) : null;
      if(tu){ var th = document.createElement("img"); th.className = "thumb"; th.alt = ""; th.loading = "lazy"; th.referrerPolicy = "no-referrer"; th.src = tu; th.addEventListener("click", openIt); item.appendChild(th); }
      item.appendChild(p);
      out.appendChild(item);
    });
  }catch(e){ show("Something went wrong: " + e.message); }
}
var home = document.getElementById("home");
var page = document.getElementById("page");
function showStart(){ page.classList.add("hidden"); home.classList.remove("hidden"); }
function openCoder(code){ home.classList.add("hidden"); page.classList.remove("hidden"); out.classList.add("hidden"); reader.classList.add("hidden"); buildCoder(); coderBox.classList.remove("hidden"); if(typeof code === "string"){ coderTa.value = code; coderGo(); } window.scrollTo(0,0); }
function goSite(s){ home.classList.add("hidden"); page.classList.remove("hidden"); if(s.app) openApp(s); else openReader(s); }
var sugBox = document.getElementById("suggest");
renderSuggest(sugBox);
var _run = run;
run = function(q){ if(!q.trim()) return; home.classList.add("hidden"); page.classList.remove("hidden"); document.getElementById("q2").value = q.trim(); return _run(q); };
document.getElementById("f1").addEventListener("submit", function(e){ e.preventDefault(); run(document.getElementById("q1").value); });
document.getElementById("f2").addEventListener("submit", function(e){ e.preventDefault(); run(document.getElementById("q2").value); });
document.getElementById("logo2").addEventListener("click", function(){ closeReader(); page.classList.add("hidden"); home.classList.remove("hidden"); document.getElementById("q1").focus(); });
var fsAll = document.createElement("button"); fsAll.type = "button"; fsAll.className = "fsall"; fsAll.textContent = "⛶ Full screen";
fsAll.onclick = function(){
  if(document.fullscreenElement){ if(document.exitFullscreen) document.exitFullscreen(); return; }
  var el = document.documentElement, embedded = window.top !== window.self, p = null;
  try{ p = el.requestFullscreen ? el.requestFullscreen() : null; }catch(e){}
  if(p && p.catch) p.catch(function(){ if(embedded) window.open(location.href, "_blank"); });
  else if(!p && embedded) window.open(location.href, "_blank");
};
document.addEventListener("fullscreenchange", function(){ fsAll.textContent = document.fullscreenElement ? "Exit full screen" : "⛶ Full screen"; });
document.body.appendChild(fsAll);
